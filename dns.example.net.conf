server {
    listen 80;
    server_name dns.example.net;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name dns.example.net;
    server_tokens off;

    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/dns.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns.example.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_client_certificate /etc/nginx/mtls/forkop-client-ca.crt;
    ssl_crl /etc/nginx/mtls/forkop-client-ca.crl.pem;
    ssl_verify_client optional;
    ssl_verify_depth 1;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known) { return 404; }

    location = /dns-query { return 444; }

    location = /api/v1/router-doh {
        if ($ssl_client_verify != SUCCESS) { return 403; }

        limit_except GET POST { deny all; }

        proxy_pass http://127.0.0.1:3001/dns-query;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        root /var/www/dns.example.net;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
